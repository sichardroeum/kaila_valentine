<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Invitation</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #fff5f8; }
        #root { height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const NO_PHRASES = [
            "No 💔",
            "Pretty please? 🥺",
            "But we'd be so cute together! 💕",
            "One more chance, pookie?",
            "Don't break my heart :(",
            "What about a maybe?",
            "Please don't do this to me, I'm fragile",
        ];

        function App() {
            const [noClicks, setNoClicks] = useState(0);
            const [isValentine, setIsValentine] = useState(false);
            const yesButtonSize = (noClicks * 20) + 16;

            const firstImg = "https://media.tenor.com/VIChDQ6ejRQAAAAj/jumping-bear-hearts-no-png.gif";
            const secondImg = "https://media.tenor.com/f1xnRxTRxLAAAAAj/bears-with-kisses-bg.gif";

            const handleNo = () => {
                setNoClicks(prev => prev + 1);
            };

            const handleYes = () => {
                setIsValentine(true);
            };

            return (
                <div style={{
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    justifyContent: "center",
                    textAlign: "center",
                    padding: "20px"
                }}>
                    {!isValentine ? (
                        <>
                            <img src={firstImg} alt="Cute bear" style={{ width: "200px" }} />
                            <h1 style={{ color: "#d32f2f" }}>Will you be my Valentine? 💘</h1>
                            <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", justifyContent: "center" }}>
                                <button
                                    onClick={handleYes}
                                    style={{
                                        fontSize: `${yesButtonSize}px`,
                                        margin: "10px",
                                        padding: "10px 20px",
                                        backgroundColor: "#4caf50",
                                        color: "white",
                                        border: "none",
                                        borderRadius: "5px",
                                        cursor: "pointer",
                                    }}
                                >
                                    Yes
                                </button>
                                <button
                                    onClick={handleNo}
                                    style={{
                                        fontSize: "16px",
                                        margin: "10px",
                                        padding: "10px 20px",
                                        backgroundColor: "#f44336",
                                        color: "white",
                                        border: "none",
                                        borderRadius: "5px",
                                        cursor: "pointer",
                                    }}
                                >
                                    {noClicks === 0 ? "No" : NO_PHRASES[Math.min(noClicks - 1, NO_PHRASES.length - 1)]}
                                </button>
                            </div>
                        </>
                    ) : (
                        <>
                            <img src={secondImg} alt="Bears kissing" style={{ width: "250px" }} />
                            <div style={{
                                fontSize: "48px",
                                color: "#ec407a",
                                fontWeight: "bold",
                                marginTop: "20px"
                            }}>
                                Yay!!! 💖🎉
                            </div>
                        </>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
