<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kaila ❤️</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fff5f8; 
            overflow-x: hidden;
        }
        #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        
        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.3);
            font-size: 20px;
            animation: float 6s linear infinite;
            top: 100vh;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .success-bg {
            animation: bg-flash 0.5s infinite alternate;
        }
        @keyframes bg-flash {
            from { background-color: #fff5f8; }
            to { background-color: #ffe0e9; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const NO_PHRASES = [
            "No 💔",
            "Kaila, please? 🥺",
            "BABY PLEASE 💕",
            "I'll buy you snacks! 🍫",
            "BABY I WIILL DIE/CRY",
            "I WILL TICKLE YOUUUU",
            "IF YOU DONT PRESS YESS IM GOING TO MURDER YOU",
        ];

        // Progressive GIFs for when she clicks "No"
        const NO_GIFS = [
            "https://media.tenor.com/VIChDQ6ejRQAAAAj/jumping-bear-hearts-no-png.gif", // Stage 0
            "https://media.tenor.com/f79N76I7X-0AAAAj/milk-and-mocha-bear.gif",         // Stage 1
            "https://media.tenor.com/83uD8pU8X8AAAAAj/milk-and-mocha-bear.gif",         // Stage 2
            "https://media.tenor.com/6_O9I_0-108AAAAj/milk-and-mocha.gif",              // Stage 3
            "https://media.tenor.com/7u60Y31Yk_sAAAAj/milk-and-mocha-crying.gif",       // Stage 4
            "https://media.tenor.com/vH_fQ15K78AAAAAj/milk-and-mocha-bear.gif",         // Stage 5
            "https://media.tenor.com/p_E0q9tB2-8AAAAAj/cat-begging.gif"                 // Final Warning
        ];

        const YES_GIF = "https://media.tenor.com/f1xnRxTRxLAAAAAj/bears-with-kisses-bg.gif";

        function HeartBackground() {
            const [hearts, setHearts] = useState([]);
            useEffect(() => {
                const interval = setInterval(() => {
                    setHearts(prev => [...prev, { id: Date.now(), left: Math.random() * 100 }]);
                }, 400);
                return () => clearInterval(interval);
            }, []);

            return (
                <div style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', pointerEvents: 'none' }}>
                    {hearts.map(h => (
                        <span key={h.id} className="heart" style={{ left: `${h.left}%` }}>❤️</span>
                    ))}
                </div>
            );
        }

        function App() {
            const [noClicks, setNoClicks] = useState(0);
            const [isValentine, setIsValentine] = useState(false);
            const yesButtonSize = (noClicks * 20) + 16;

            // Pick the GIF based on how many times she clicked No
            const currentGif = isValentine ? YES_GIF : NO_GIFS[Math.min(noClicks, NO_GIFS.length - 1)];

            return (
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", padding: "20px", zIndex: 1 }}>
                    <HeartBackground />
                    {!isValentine ? (
                        <>
                            <img src={currentGif} alt="Cute bear" style={{ width: "250px", height: "250px", objectFit: "contain" }} />
                            <h1 style={{ color: "#d32f2f", margin: "20px 0", maxWidth: "80%" }}>Will you be my Valentine, Kaila? 💘</h1>
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", flexWrap: "wrap", gap: "10px" }}>
                                <button
                                    onClick={() => setIsValentine(true)}
                                    style={{
                                        fontSize: `${yesButtonSize}px`,
                                        padding: "10px 20px",
                                        backgroundColor: "#4caf50",
                                        color: "white",
                                        border: "none",
                                        borderRadius: "8px",
                                        cursor: "pointer",
                                        boxShadow: "0 4px 15px rgba(76, 175, 80, 0.3)",
                                        transition: "all 0.2s"
                                    }}
                                >Yes</button>
                                <button
                                    onClick={() => setNoClicks(noClicks + 1)}
                                    style={{
                                        fontSize: "16px",
                                        padding: "10px 20px",
                                        backgroundColor: "#f44336",
                                        color: "white",
                                        border: "none",
                                        borderRadius: "8px",
                                        cursor: "pointer",
                                    }}
                                >
                                    {noClicks === 0 ? "No" : NO_PHRASES[Math.min(noClicks - 1, NO_PHRASES.length - 1)]}
                                </button>
                            </div>
                        </>
                    ) : (
                        <div style={{ animation: "fadeIn 1s", padding: "20px", borderRadius: "20px", background: "rgba(255,255,255,0.4)", backdropFilter: "blur(5px)" }}>
                            <img src={YES_GIF} alt="Bears kissing" style={{ width: "250px" }} />
                            <div style={{ fontSize: "42px", color: "#ec407a", fontWeight: "bold", marginTop: "20px", lineHeight: "1.2" }}>
                                Yay!!! u my valentine heeheehehe i give u baby... jk 💖🎉
                            </div>
                            <p style={{ fontSize: "22px", color: "#d32f2f", fontWeight: "500", marginTop: "20px" }}>
                                I love you more than anythung in this world! <br/>
                                <strong>YOU ARE MY NUMBER 1 GF AND FUTURE WIFE/BABBy MAMA</strong>
                            </p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
