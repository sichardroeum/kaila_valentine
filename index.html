<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kaila ❤️</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff5f8; }
        #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const NO_PHRASES = [
            "No 💔",
            "Kaila, please? 🥺",
            "BABY PLEASE 💕",
            "I'll buy you snacks! 🍫",
            "BABY I WIILL DIE/CRY",
            "I WILL TICKLE YOUUUU",
            "IF YOU DONT PRESS YESS IM GOING TO MURDER YOU",
        ];

        function App() {
            const [noClicks, setNoClicks] = useState(0);
            const [isValentine, setIsValentine] = useState(false);
            const yesButtonSize = (noClicks * 20) + 16;

            const firstImg = "https://media.tenor.com/VIChDQ6ejRQAAAAj/jumping-bear-hearts-no-png.gif";
            const secondImg = "https://media.tenor.com/f1xnRxTRxLAAAAAj/bears-with-kisses-bg.gif";

            return (
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", padding: "20px" }}>
                    {!isValentine ? (
                        <>
                            <img src={firstImg} alt="Cute bear" style={{ width: "200px" }} />
                            <h1 style={{ color: "#d32f2f", margin: "20px 0" }}>Will you be my Valentine, Kaila? 💘</h1>
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", flexWrap: "wrap", gap: "10px" }}>
                                <button
                                    onClick={() => setIsValentine(true)}
                                    style={{
                                        fontSize: `${yesButtonSize}px`,
                                        padding: "10px 20px",
                                        backgroundColor: "#4caf50",
                                        color: "white",
                                        border: "none",
                                        borderRadius: "5px",
                                        cursor: "pointer",
                                    }}
                                >Yes</button>
                                <button
                                    onClick={() => setNoClicks(noClicks + 1)}
                                    style={{
                                        fontSize: "16px",
                                        padding: "10px 20px",
                                        backgroundColor: "#f44336",
                                        color: "white",
                                        border: "none",
                                        borderRadius: "5px",
                                        cursor: "pointer",
                                    }}
                                >
                                    {noClicks === 0 ? "No" : NO_PHRASES[Math.min(noClicks - 1, NO_PHRASES.length - 1)]}
                                </button>
                            </div>
                        </>
                    ) : (
                        <div style={{ animation: "fadeIn 1s" }}>
                            <img src={secondImg} alt="Bears kissing" style={{ width: "250px" }} />
                            <div style={{ fontSize: "42px", color: "#ec407a", fontWeight: "bold", marginTop: "20px" }}>
                                Yay!!! u my valentine heeheehehe i give u baby... jk 💖🎉
                            </div>
                            <p style={{ fontSize: "20px", color: "#d32f2f" }}>
                                I love you more than anythung in this world! <br/>
                                <strong>YOU ARE MY NUMBER 1 GF AND FUTURE WIFE/BABBy MAMA</strong>
                            </p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
