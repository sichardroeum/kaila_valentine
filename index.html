<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kaila ❤️</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fff5f8; 
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #root { width: 100%; text-align: center; z-index: 1; }
        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.3);
            font-size: 20px;
            animation: float 6s linear infinite;
            top: 100vh;
            pointer-events: none;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
        .gif-container {
            width: 250px;
            height: 250px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            overflow: hidden;
        }
        img { max-width: 100%; max-height: 100%; border-radius: 20px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const NO_PHRASES = [
            "No 💔",
            "Kaila, please? 🥺",
            "BABY PLEASE 💕",
            "I'll buy you snacks! 🍫",
            "BABY I WIILL DIE/CRY",
            "I WILL TICKLE YOUUUU",
            "IF YOU DONT PRESS YESS IM GOING TO MURDER YOU",
        ];

        // RELIABLE IMGUR LINKS
        const NO_GIFS = [
            "https://i.imgur.com/BfbeY9v.gif", // Jumping bear
            "https://i.imgur.com/8m4v5qS.gif", // Sad bear
            "https://i.imgur.com/07Y2GvK.gif", // Crying bear
            "https://i.imgur.com/796Hh9A.gif", // Angry/sad bear
            "https://i.imgur.com/E8S01r4.gif", // Devastated
        ];

        const YES_GIF = "https://i.imgur.com/vS3Lh4L.gif"; // Bears kissing

        function HeartBackground() {
            const [hearts, setHearts] = useState([]);
            useEffect(() => {
                const interval = setInterval(() => {
                    setHearts(prev => [...prev, { id: Date.now(), left: Math.random() * 100 }]);
                }, 400);
                return () => clearInterval(interval);
            }, []);
            return (
                <>
                    {hearts.map(h => <span key={h.id} className="heart" style={{ left: `${h.left}%` }}>❤️</span>)}
                </>
            );
        }

        function App() {
            const [noClicks, setNoClicks] = useState(0);
            const [isValentine, setIsValentine] = useState(false);
            
            const yesButtonSize = (noClicks * 20) + 18;
            const currentGif = isValentine ? YES_GIF : NO_GIFS[Math.min(noClicks, NO_GIFS.length - 1)];

            return (
                <div>
                    <HeartBackground />
                    <div className="gif-container">
                        <img key={currentGif} src={currentGif} alt="Cute animation" />
                    </div>
                    
                    {!isValentine ? (
                        <>
                            <h1 style={{ color: "#d32f2f", margin: "20px 0" }}>Will you be my Valentine, Kaila? 💘</h1>
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", flexWrap: "wrap", gap: "10px" }}>
                                <button
                                    onClick={() => setIsValentine(true)}
                                    style={{
                                        fontSize: `${yesButtonSize}px`,
                                        padding: "10px 20px",
                                        backgroundColor: "#4caf50",
                                        color: "white",
                                        border: "none",
                                        borderRadius: "8px",
                                        cursor: "pointer",
                                        boxShadow: "0 4px 15px rgba(0,0,0,0.1)"
                                    }}
                                >Yes</button>
                                <button
                                    onClick={() => setNoClicks(noClicks + 1)}
                                    style={{
                                        fontSize: "16px",
                                        padding: "10px 20px",
                                        backgroundColor: "#f44336",
                                        color: "white",
                                        border: "none",
                                        borderRadius: "8px",
                                        cursor: "pointer",
                                    }}
                                >
                                    {noClicks === 0 ? "No" : NO_PHRASES[Math.min(noClicks - 1, NO_PHRASES.length - 1)]}
                                </button>
                            </div>
                        </>
                    ) : (
                        <div style={{ animation: "fadeIn 1s" }}>
                            <div style={{ fontSize: "32px", color: "#ec407a", fontWeight: "bold", marginTop: "20px", padding: "0 10px" }}>
                                Yay!!! u my valentine heeheehehe i give u baby... jk 💖🎉
                            </div>
                            <p style={{ fontSize: "18px", color: "#d32f2f", padding: "0 20px" }}>
                                I love you more than anythung in this world! <br/>
                                <strong>YOU ARE MY NUMBER 1 GF AND FUTURE WIFE/BABBy MAMA</strong>
                            </p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
