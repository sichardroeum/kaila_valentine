<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kaila ❤️</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fff5f8; 
            overflow-x: hidden;
        }
        #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        
        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.3);
            font-size: 20px;
            animation: float 6s linear infinite;
            top: 100vh;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const NO_PHRASES = [
            "No 💔",
            "Kaila, please? 🥺",
            "But we'd be so cute together! 💕",
            "One more chance, beautiful?",
            "Don't break my heart :(",
            "I'll buy you snacks! 🍫",
            "Please don't do this to me, I'm fragile",
        ];

        function HeartBackground() {
            const [hearts, setHearts] = useState([]);
            useEffect(() => {
                const interval = setInterval(() => {
                    setHearts(prev => [...prev, { id: Date.now(), left: Math.random() * 100 }]);
                }, 400);
                return () => clearInterval(interval);
            }, []);

            return (
                <div style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', pointerEvents: 'none' }}>
                    {hearts.map(h => (
                        <span key={h.id} className="heart" style={{ left: `${h.left}%` }}>❤️</span>
                    ))}
                </div>
            );
        }

        function App() {
            const [noClicks, setNoClicks] = useState(0);
            const [isValentine, setIsValentine] = useState(false);
            const yesButtonSize = (noClicks * 20) + 16;

            const firstImg = "https://media.tenor.com/VIChDQ6ejRQAAAAj/jumping-bear-hearts-no-png.gif";
            const secondImg = "https://media.tenor.com/f1xnRxTRxLAAAAAj/bears-with-kisses-bg.gif";

            return (
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", padding: "20px", zIndex: 1 }}>
                    <HeartBackground />
                    {!isValentine ? (
                        <>
                            <img src={firstImg} alt="Cute bear" style={{ width: "200px" }} />
                            <h1 style={{ color: "#d32f2f", margin: "20px 0" }}>Will you be my Valentine, Kaila? 💘</h1>
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", flexWrap: "wrap", gap: "10px" }}>
                                <button
                                    onClick={() => setIsValentine(true)}
                                    style={{
                                        fontSize: `${yesButtonSize}px`,
                                        padding: "10px 20px",
                                        backgroundColor: "#4caf50",
                                        color: "white",
                                        border: "none",
                                        borderRadius: "8px",
                                        cursor: "pointer",
                                        boxShadow: "0 4px 15px rgba(76, 175, 80, 0.3)"
                                    }}
                                >Yes</button>
                                <button
                                    onClick={() => setNoClicks(noClicks + 1)}
                                    style={{
                                        fontSize: "16px",
                                        padding: "10px 20px",
                                        backgroundColor: "#f44336",
                                        color: "white",
                                        border: "none",
                                        borderRadius: "8px",
                                        cursor: "pointer",
                                    }}
                                >
                                    {noClicks === 0 ? "No" : NO_PHRASES[Math.min(noClicks - 1, NO_PHRASES.length - 1)]}
                                </button>
                            </div>
                        </>
                    ) : (
                        <div style={{ animation: "fadeIn 1s" }}>
                            <img src={secondImg} alt="Bears kissing" style={{ width: "250px" }} />
                            <div style={{ fontSize: "48px", color: "#ec407a", fontWeight: "bold", marginTop: "20px" }}>
                                Yay!!! See you soon, Kaila! 💖🎉
                            </div>
                            <p style={{ fontSize: "20px", color: "#d32f2f" }}>I love you more than all the snacks in the world! 🍫</p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
