<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kaila ❤️</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fff5f8; 
            overflow-x: hidden;
        }
        #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        
        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.3);
            font-size: 20px;
            animation: float 6s linear infinite;
            top: 100vh;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* Shake animation for the No button */
        .shake {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const NO_PHRASES = [
            "No 💔",
            "Kaila, please? 🥺",
            "BABY PLEASE 💕",
            "I'll buy you snacks! 🍫",
            "BABY I WIILL DIE/CRY",
            "I WILL TICKLE YOUUUU",
            "IF YOU DONT PRESS YESS IM GOING TO MURDER YOU",
        ];

        // FIXED DIRECT LINKS
        const NO_GIFS = [
            "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExMmo3c3l5ODh3Z2p3M201b2p6Ym10bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/T2pXovkCPlYpL66LTC/giphy.gif",
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif",
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/TW8Ma1a8ZsZGw/giphy.gif",
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/3o7TKVUn7iM8FMEU24/giphy.gif",
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/K6jSj8kkjBWZ3Y9mxl/giphy.gif"
        ];

        const YES_GIF = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/L2z7uicW8z2Ym1jWpB/giphy.gif";

        function HeartBackground() {
            const [hearts, setHearts] = useState([]);
            useEffect(() => {
                const interval = setInterval(() => {
                    setHearts(prev => [...prev, { id: Date.now(), left: Math.random() * 100 }]);
                }, 400);
                return () => clearInterval(interval);
            }, []);
            return (
                <div style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', pointerEvents: 'none' }}>
                    {hearts.map(h => <span key={h.id} className="heart" style={{ left: `${h.left}%` }}>❤️</span>)}
                </div>
            );
        }

        function App() {
            const [noClicks, setNoClicks] = useState(0);
            const [isValentine, setIsValentine] = useState(false);
            const [isShaking, setIsShaking] = useState(false);
            
            const yesButtonSize = (noClicks * 20) + 16;
            const currentGif = isValentine ? YES_GIF : NO_GIFS[Math.min(noClicks, NO_GIFS.length - 1)];

            const handleNo = () => {
                setNoClicks(noClicks + 1);
                setIsShaking(true);
                setTimeout(() => setIsShaking(false), 500);
            };

            return (
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", padding: "20px", zIndex: 1 }}>
                    <HeartBackground />
                    {!isValentine ? (
                        <>
                            <img key={currentGif} src={currentGif} alt="Cute bear" style={{ width: "250px", height: "250px", borderRadius: "20px" }} />
                            <h1 style={{ color: "#d32f2f", margin: "20px 0" }}>Will you be my Valentine, Kaila? 💘</h1>
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", flexWrap: "wrap", gap: "10px" }}>
                                <button
                                    onClick={() => setIsValentine(true)}
                                    style={{
                                        fontSize: `${yesButtonSize}px`,
                                        padding: "10px 20px",
                                        backgroundColor: "#4caf50",
                                        color: "white",
                                        border: "none",
                                        borderRadius: "8px",
                                        cursor: "pointer",
                                        boxShadow: "0 4px 15px rgba(76,175,80,0.3)"
                                    }}
                                >Yes</button>
                                <button
                                    onClick={handleNo}
                                    className={isShaking ? "shake" : ""}
                                    style={{
                                        fontSize: "16px",
                                        padding: "10px 20px",
                                        backgroundColor: "#f44336",
                                        color: "white",
                                        border: "none",
                                        borderRadius: "8px",
                                        cursor: "pointer",
                                    }}
                                >
                                    {noClicks === 0 ? "No" : NO_PHRASES[Math.min(noClicks - 1, NO_PHRASES.length - 1)]}
                                </button>
                            </div>
                        </>
                    ) : (
                        <div style={{ animation: "fadeIn 1s" }}>
                            <img src={YES_GIF} alt="Bears kissing" style={{ width: "250px", borderRadius: "20px" }} />
                            <div style={{ fontSize: "42px", color: "#ec407a", fontWeight: "bold", marginTop: "20px" }}>
                                Yay!!! u my valentine heeheehehe i give u baby... jk 💖🎉
                            </div>
                            <p style={{ fontSize: "20px", color: "#d32f2f" }}>
                                I love you more than anythung in this world! <br/>
                                <strong>YOU ARE MY NUMBER 1 GF AND FUTURE WIFE/BABBy MAMA</strong>
                            </p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
